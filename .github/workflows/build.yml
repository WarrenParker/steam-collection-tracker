name: Build

# Every push to main builds and tests the Windows app. When the version in
# src-tauri/Cargo.toml has no release yet, the build also publishes one,
# which is what the app's updater downloads.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      UPDATE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install interface packages
        shell: bash
        run: set -o pipefail; npm install 2>&1 | tee -a build.log

      - name: Build interface
        shell: bash
        run: set -o pipefail; npm run build 2>&1 | tee -a build.log

      - name: Run tests
        shell: bash
        run: set -o pipefail; cargo test --manifest-path src-tauri/Cargo.toml 2>&1 | tee -a build.log

      - name: Build app
        shell: bash
        run: set -o pipefail; npx tauri build 2>&1 | tee -a build.log

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/steam-collection-tracker.exe out/SteamCollectionTracker.exe
          $hash = (Get-FileHash out/SteamCollectionTracker.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/SteamCollectionTracker.exe.sha256 -Value $hash -NoNewline
          $size = [math]::Round((Get-Item out/SteamCollectionTracker.exe).Length / 1MB, 1)
          "Built SteamCollectionTracker.exe ($size MB), sha256 $hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "Built SteamCollectionTracker.exe ($size MB)" | Out-File -FilePath build.log -Append

      - uses: actions/upload-artifact@v4
        with:
          name: SteamCollectionTracker
          path: out/

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = "v$version"
          gh release view $tag 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            "Release $tag already exists, so nothing was published." | Out-File -FilePath build.log -Append
            exit 0
          }
          gh release create $tag out/SteamCollectionTracker.exe out/SteamCollectionTracker.exe.sha256 --target $env:GITHUB_SHA --title "Steam Collection Tracker $tag" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "Published release $tag" | Out-File -FilePath build.log -Append

      # Post a short build report as an annotation, which can be read through
      # GitHub's API: test results, warnings and size on success, the tail of
      # the log on failure.
      - name: Report
        if: always()
        shell: bash
        run: |
          encode() { sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}'; }
          touch build.log
          if [ "${{ job.status }}" = "success" ]; then
            body=$( { grep -E "test result|Built SteamCollectionTracker|Published release|already exists" build.log || true; grep -E "^warning|^\(!\)|svelte.*\(" build.log | sort | uniq -c | sort -rn | head -40 || true; } | encode)
            echo "::notice title=Build report::${body}"
          else
            body=$( { grep -v -E "^\s*(Compiling|Downloading|Downloaded|Checking|Fresh)\b" build.log || true; } | tail -n 150 | encode)
            echo "::error title=Build failed::${body}"
          fi
