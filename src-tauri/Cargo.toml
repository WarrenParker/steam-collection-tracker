[package]
name = "steam-collection-tracker"
version = "0.8.0"
description = "Tracks how complete your Steam item collection is"
edition = "2021"
publish = false

[lib]
name = "app_lib"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json", "gzip", "charset", "http2"] }
tokio = { version = "1", features = ["time", "sync"] }
semver = "1"
sha2 = "0.10"
self-replace = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
base64 = "0.22"
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
